{% extends 'accounts/base.html' %}
{% block content %}
<div class="content-card">
    <h2>Add Character to {{ universe.name }}</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Character</button>
    </form>
    <br>
    <a href="{% url 'universe_detail' universe.id %}">Cancel</a>
</div>
{% endblock %}
