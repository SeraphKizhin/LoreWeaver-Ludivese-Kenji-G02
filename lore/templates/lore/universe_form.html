{% extends 'accounts/base.html' %}
{% block content %}

        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Universe</button>
    </form>
    <br>
    <a href="{% url 'universe_list' %}">Cancel</a>
{% endblock %}
